name: 构建 Mihomo MRS 规则集

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Rule/Clash/**'
      - 'rule/clash/**'
  schedule:
    - cron: '0 20 * * *'        # ⏰ 每天北京时间凌晨 04:00 自动运行
  workflow_dispatch:             # 保留手动运行按钮

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # 给予发布到 release 分支的读写权限

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 下载最新版 Mihomo CLI
      - name: Download Mihomo CLI
        run: |
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64" | grep -v "compatible" | head -n 1 | cut -d '"' -f 4)
          curl -L $MIHOMO_URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo

      # 3. 智能抽取并编译
      - name: Build MRS files
        run: |
          mkdir -p output
          shopt -s globstar nullglob nocaseglob
          
          files=(Rule/Clash/*.yaml Rule/Clash/*.yml rule/clash/*.yaml rule/clash/*.yml)

          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ 错误：未在 Rule/Clash 路径下找到任何 .yaml 或 .yml 文件！"
            exit 1
          fi

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" | sed 's/\.[^.]*$//')
              echo "----------------------------------------"
              echo "正在处理文件: ${file}"

              # --- 1. 提取与编译 域名 (Domain) 规则 ---
              # 匹配规则：包含 DOMAIN 关键字 或 以 +./. 开头/含域名的行，且排除 IP 行与 payload 标头
              grep -iE "DOMAIN|\+\.|^[[:space:]]*- '?[+a-zA-Z0-9_-]+\.[a-zA-Z0-9._-]+'?" "$file" \
                | grep -vE "IP-CIDR|IP-CIDR6|payload:" \
                | sed 's/^[[:space:]]*-[[:space:]]*/  - /' \
                | sed "s/  - DOMAIN-SUFFIX,/  - '+./g; s/  - DOMAIN,/  - '/g; s/  - DOMAIN-KEYWORD,/  - 'keyword:/g" \
                > domain_lines.txt || true

              if [ -s domain_lines.txt ]; then
                echo "payload:" > tmp_domain.yaml
                cat domain_lines.txt >> tmp_domain.yaml
                echo "--> 正在编译域名规则: output/${filename}_domain.mrs"
                ./mihomo convert-ruleset domain yaml tmp_domain.yaml "output/${filename}_domain.mrs" || true
                rm -f tmp_domain.yaml
              else
                echo "--> 未在这个文件中找到有效域名规则"
              fi
              rm -f domain_lines.txt

              # --- 2. 提取与编译 IP (IP-CIDR) 规则 ---
              # 匹配规则：包含 IP-CIDR 关键字 或 匹配标准的 IPv4/IPv6 CIDR 格式
              grep -iE "IP-CIDR|([0-9]{1,3}\.){3}[0-9]{1,3}\/[0-9]+|[0-9a-fA-F:]+:[0-9a-fA-F:]*\/[0-9]+" "$file" \
                | grep -vE "payload:" \
                | sed -E 's/IP-CIDR6?:,//g' \
                | sed 's/^[[:space:]]*-[[:space:]]*/  - /' \
                > ip_lines.txt || true

              if [ -s ip_lines.txt ]; then
                echo "payload:" > tmp_ip.yaml
                cat ip_lines.txt >> tmp_ip.yaml
                echo "--> 正在编译 IP 规则: output/${filename}_ip.mrs"
                ./mihomo convert-ruleset ipcidr yaml tmp_ip.yaml "output/${filename}_ip.mrs" || true
                rm -f tmp_ip.yaml
              else
                echo "--> 未在这个文件中找到有效 IP 规则"
              fi
              rm -f ip_lines.txt

            fi
          done

      # 4. 发布编译好的 .mrs 文件到 release 分支
      - name: Deploy to release branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: release
          keep_files: false
          force_orphan: true
