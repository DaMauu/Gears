name: 构建 Mihomo MRS 规则集 (支持混合规则)

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'Rule/Clash/**'
      - 'rule/clash/**'
  schedule:
    - cron: '0 20 * * *'        # ⏰ 每天北京时间凌晨 04:00 自动运行
  workflow_dispatch:             # 保留手动运行按钮

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write            # 给予发布到 release 分支的读写权限

    steps:
      # 1. 拉取代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 下载最新版 Mihomo CLI
      - name: Download Mihomo CLI
        run: |
          MIHOMO_URL=$(curl -s https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | grep "browser_download_url" | grep "linux-amd64" | grep -v "compatible" | head -n 1 | cut -d '"' -f 4)
          curl -L $MIHOMO_URL -o mihomo.gz
          gunzip mihomo.gz
          chmod +x mihomo

      # 3. 智能拆分并编译所有 yaml/yml 文件
      - name: Build MRS files
        run: |
          mkdir -p output
          shopt -s globstar nullglob nocaseglob
          
          files=(Rule/Clash/*.yaml Rule/Clash/*.yml rule/clash/*.yaml rule/clash/*.yml)

          if [ ${#files[@]} -eq 0 ]; then
            echo "❌ 错误：未在 Rule/Clash 路径下找到任何 .yaml 或 .yml 文件！"
            exit 1
          fi

          for file in "${files[@]}"; do
            if [ -f "$file" ]; then
              filename=$(basename "$file" | sed 's/\.[^.]*$//')
              echo "----------------------------------------"
              echo "正在分析文件: ${file}"

              # 1. 提取并编译 DOMAIN 域名规则 (生成 xxx.mrs)
              grep -iE "DOMAIN|DOMAIN-SUFFIX|DOMAIN-KEYWORD" "$file" > domain_tmp.txt || true
              if [ -s domain_tmp.txt ]; then
                echo "payload:" > domain_tmp.yaml
                sed 's/^/  - /' domain_tmp.txt >> domain_tmp.yaml
                echo "--> 正在编译域名规则 -> output/${filename}.mrs"
                ./mihomo convert-ruleset domain yaml domain_tmp.yaml "output/${filename}.mrs" || true
                rm -f domain_tmp.yaml
              fi
              rm -f domain_tmp.txt

              # 2. 提取并编译 IP-CIDR 规则 (生成 xxx_ip.mrs)
              grep -iE "IP-CIDR|IP-CIDR6" "$file" > ip_tmp.txt || true
              if [ -s ip_tmp.txt ]; then
                echo "payload:" > ip_tmp.yaml
                sed 's/^/  - /' ip_tmp.txt >> ip_tmp.yaml
                echo "--> 正在编译 IP 规则 -> output/${filename}_ip.mrs"
                ./mihomo convert-ruleset ipcidr yaml ip_tmp.yaml "output/${filename}_ip.mrs" || true
                rm -f ip_tmp.yaml
              fi
              rm -f ip_tmp.txt
            fi
          done

      # 4. 发布编译好的 .mrs 文件到 release 分支
      - name: Deploy to release branch
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./output
          publish_branch: release
          keep_files: false
          force_orphan: true
